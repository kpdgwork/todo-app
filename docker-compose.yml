services:
  todo:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: /todo-maintenanace
    image: focusflow-todo:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /todo-maintenanace
    ports:
      - "7444:7444"
    volumes:
      # Persist the file database beside this compose file.
      - ./data:/app/data
